name: Gerar Web (WASM) do Bio

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o projeto
        run: |
          mkdir -p proj
          if [ -f bio_projeto.zip ]; then
            unzip -o bio_projeto.zip -d proj
          else
            cp -r Cargo.toml src proj/
          fi

      - name: Instalar Rust e alvo wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compilar para WebAssembly
        run: |
          cd proj
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../web_dist
          cp target/wasm32-unknown-unknown/release/bio.wasm ../web_dist/bio.wasm

      - name: Criar index.html do Macroquad
        run: |
          cat << 'EOF' > web_dist/index.html
          <!doctype html>
          <html lang="pt">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Bio</title>
            <style>
              html, body, canvas {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0a0a0e;
                touch-action: none;
              }
            </style>
          </head>
          <body>
            <canvas id="glcanvas" tabindex="1"></canvas>
            <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
            <script>load("bio.wasm");</script>
          </body>
          </html>
          EOF

      - name: Subir artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
