name: Gerar APK do Bio

on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: [ main, master ]

permissions:
  contents: write           # para publicar o APK numa Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o projeto (usa bio_projeto.zip se existir)
        run: |
          mkdir -p proj
          if [ -f bio_projeto.zip ]; then
            unzip -o bio_projeto.zip -d proj
          else
            cp -r Cargo.toml src proj/
          fi
          ls -R proj | head -30

      - name: Criar chave de assinatura do APK
        run: |
          keytool -genkey -v -keystore proj/release.keystore -alias bio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Bio, O=Bio, C=BR"

      - name: Compilar o APK (cargo-quad-apk no Docker)
        run: |
          docker run --rm \
            -e CARGO_APK_RELEASE_KEYSTORE=/root/src/release.keystore \
            -e CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android \
            -v "$PWD/proj":/root/src -w /root/src \
            notfl3/cargo-apk \
            sh -c "rustup default stable && rustup update stable && rustup target add armv7-linux-androideabi aarch64-linux-android && (cargo quad-apk build --release || cargo quad-apk build)"

      - name: Separar o APK
        run: |
          APK=$(find proj/target -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK"
          test -n "$APK"
          cp "$APK" Bio.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Bio-apk
          path: Bio.apk

      - name: Publicar numa Release (baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bio APK ${{ github.run_number }}
          files: Bio.apk
