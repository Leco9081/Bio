name: Gerar APK do Bio

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o projeto (usa bio_projeto.zip se existir)
        run: |
          mkdir -p proj
          if [ -f bio_projeto.zip ]; then
            unzip -o bio_projeto.zip -d proj
          else
            cp -r Cargo.toml src proj/
          fi
          ls -R proj | head -30

      - name: Criar chave de assinatura do APK
        run: |
          keytool -genkeypair -v -keystore proj/release.keystore -alias bio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Bio, O=Bio, C=BR"

      - name: Compilar o APK (apenas aarch64 no Docker)
        run: |
          docker run --rm \
            -e CARGO_APK_RELEASE_KEYSTORE=/root/src/release.keystore \
            -e CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android \
            -e CARGO_APK_RELEASE_KEY_ALIAS=bio \
            -e CARGO_APK_RELEASE_KEY_PASSWORD=android \
            -v "$PWD/proj":/root/src -w /root/src \
            notfl3/cargo-apk \
            sh -c "rustup default stable && rustup update stable && rustup target add aarch64-linux-android && (cargo quad-apk build --release --target aarch64-linux-android || cargo quad-apk build --target aarch64-linux-android)"

      - name: Separar e garantir assinatura/alinhamento do APK
        run: |
          APK=$(find proj/target -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK"
          test -n "$APK"
          cp "$APK" Bio.apk

          BUILD_TOOLS=$(find /usr -name "zipalign" 2>/dev/null | head -n 1 | xargs dirname 2>/dev/null || true)
          APKSIGNER=$(find /usr -name "apksigner" 2>/dev/null | head -n 1 || true)

          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/zipalign" ]; then
            "$BUILD_TOOLS/zipalign" -f -p 4 Bio.apk Bio-aligned.apk
            mv Bio-aligned.apk Bio.apk
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" sign --ks proj/release.keystore \
              --ks-key-alias bio \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out Bio-signed.apk Bio.apk
            mv Bio-signed.apk Bio.apk
          fi

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Bio-apk
          path: Bio.apk

      - name: Publicar numa Release (baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bio APK ${{ github.run_number }}
          files: Bio.apk
          
